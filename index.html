<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coccoon</title>
    <link rel="manifest" href="manifest.json">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
        background: #0c121c;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        height: 100dvh; /* динамическая высота для мобильных браузеров */
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }

    /*
     * Сетка из трёх строк: 1fr / auto / 1fr.
     * Средняя строка (subtitle) всегда ровно по центру.
     * Подзаголовок — якорь, всё остальное привязано к нему.
     */
    .center-wrapper {
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        height: 100dvh;
        width: 100%;
        justify-items: center;
    }

    /* Заголовок — в верхней строке, прижат к подзаголовку */
    .top {
        grid-row: 1;
        align-self: end;
        padding-bottom: 0.2rem;
        padding-inline: 1rem;
        max-width: 100%;
    }

    h1 {
        font-size: clamp(44px, 11vh, 120px);
        font-weight: 400;
        font-family: 'Impact', 'Arial Narrow', sans-serif;
        color: #405770;
        letter-spacing: clamp(2px, 0.4vw, 4px);
        line-height: 1;
        white-space: nowrap;
    }

    /* Подзаголовок — якорь, всегда по центру */
    .subtitle {
        grid-row: 2;
        font-size: clamp(10px, 1.4vh, 18px);
        color: #2e3d4f;
        letter-spacing: clamp(1px, 0.15vw, 2px);
        text-transform: uppercase;
        font-family: 'Arial Black', 'Helvetica Bold', sans-serif;
        text-align: center;
        padding-inline: 1rem;
    }

    /* Шары — в нижней строке, прижаты к подзаголовку */
    .bottom {
        grid-row: 3;
        align-self: start;
        padding-top: 3rem;
        padding-inline: 1rem;
        max-width: 100%;
    }

    .balls-container {
        position: relative;
        display: flex;
        gap: clamp(6px, 1.2vw, 20px);
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
    }

    .ball {
        width: clamp(20px, 4.5vh, 50px);
        height: clamp(20px, 4.5vh, 50px);
        border-radius: 50%;
        transform-origin: bottom;
        pointer-events: auto;
        flex-shrink: 0;
    }

    .ball:nth-child(1) { background: #7aa2f7; }
    .ball:nth-child(2) { background: #f28b82; }
    .ball:nth-child(3) { background: #98c379; }
    .ball:nth-child(4) { background: #bb9af7; }
    .ball:nth-child(5) { background: #ffb347; }

    /* Кнопка — абсолютный центр контейнера шаров */
    .btn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background-color: transparent;
        color: #cdd9ea;
        font-size: clamp(13px, 2.2vh, 24px);
        padding: 12px 70px;
        border-radius: 40px;
        text-decoration: none;
        font-family: 'Impact', 'Arial Narrow', sans-serif;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 100;
        white-space: nowrap;
        pointer-events: auto;
    }

    .btn.visible {
        opacity: 1;
    }

    /* ===== ЗАГЛУШКА ДЛЯ МАЛЕНЬКИХ ЭКРАНОВ ===== */
    .mobile-warning {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #0c121c;
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 30px;
        box-sizing: border-box;
    }

    .mobile-warning.show {
        display: flex;
    }

    .mobile-warning h2 {
        font-size: clamp(22px, 3.5vh, 28px);
        margin-bottom: 15px;
        font-family: 'Impact', 'Arial Narrow', sans-serif;
        color: #7aa2f7;
        letter-spacing: 1px;
    }

    .mobile-warning p {
        font-size: clamp(14px, 2.2vh, 16px);
        color: #8f9eb5;
        line-height: 1.6;
        max-width: 320px;
    }

    /* =========================================================
       ЯВНАЯ АДАПТАЦИЯ ПО БРЕЙКПОИНТАМ
       (дополняет clamp() точными пределами на каждом диапазоне)
       ========================================================= */

    /* Ноутбуки и небольшие мониторы */
    @media (max-width: 1200px) {
        h1 { font-size: clamp(56px, 10vh, 100px); }
        .subtitle { font-size: clamp(12px, 1.3vh, 16px); }
        .btn { font-size: clamp(16px, 2vh, 22px); padding: 12px 60px; }
    }

    /* Планшеты */
    @media (max-width: 992px) {
        h1 { font-size: clamp(48px, 9vh, 80px); letter-spacing: 3px; }
        .subtitle { font-size: 13px; letter-spacing: 1.5px; }
        .btn { font-size: 18px; padding: 10px 55px; }
        .ball { width: clamp(24px, 5vh, 40px); height: clamp(24px, 5vh, 40px); }
        .balls-container { gap: 12px; }
    }

    /* ===== ТЕЛЕФОНЫ ===== */
    @media (max-width: 768px) {
        .center-wrapper {
            grid-template-rows: 1fr auto 1fr;
        }

        h1 {
            font-size: clamp(40px, 9vh, 64px);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .btn {
            font-size: 15px;
            padding: 10px 42px;
        }

        .ball {
            width: clamp(20px, 5vh, 34px);
            height: clamp(20px, 5vh, 34px);
        }

        .balls-container {
            gap: 10px;
        }
    }

    /* Маленькие телефоны (iPhone SE, Galaxy A-серия и т.п.) */
    @media (max-width: 576px) {
        h1 {
            font-size: clamp(34px, 8vh, 52px);
            letter-spacing: 1.5px;
        }

        .subtitle {
            font-size: 10px;
            letter-spacing: 1px;
        }

        .btn {
            font-size: 14px;
            padding: 9px 34px;
        }

        .ball {
            width: clamp(18px, 4.5vh, 28px);
            height: clamp(18px, 4.5vh, 28px);
        }

        .balls-container {
            gap: 8px;
        }
    }

    /* Очень узкие телефоны */
    @media (max-width: 400px) {
        h1 {
            font-size: clamp(28px, 7.5vh, 42px);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 0.5px;
        }

        .btn {
            font-size: 13px;
            padding: 8px 28px;
        }

        .ball {
            width: 22px;
            height: 22px;
        }

        .balls-container {
            gap: 6px;
        }

        .mobile-warning h2 { font-size: 22px; }
        .mobile-warning p { font-size: 14px; }
    }

    /* ===== АЛЬБОМНАЯ ОРИЕНТАЦИЯ / НИЗКИЕ ЭКРАНЫ ===== */
    @media (max-height: 700px) {
        h1 { font-size: clamp(40px, 12vh, 80px); }
        .subtitle { font-size: 12px; }
        .btn { font-size: 16px; padding: 9px 50px; }
        .ball { width: clamp(22px, 5vh, 40px); height: clamp(22px, 5vh, 40px); }
    }

    @media (max-height: 500px) {
        h1 { font-size: clamp(32px, 11vh, 60px); letter-spacing: 2px; }
        .subtitle { font-size: 10px; }
        .btn { font-size: 14px; padding: 7px 36px; }
        .ball { width: clamp(18px, 5.5vh, 30px); height: clamp(18px, 5.5vh, 30px); }
        .balls-container { gap: 8px; }
    }

    /* ===== ТЕЛЕФОН В ПОРТРЕТНОЙ ОРИЕНТАЦИИ (специально) ===== */
    @media (max-width: 768px) and (orientation: portrait) {
        .center-wrapper {
            /* Чуть больше воздуха вокруг подзаголовка-якоря */
            grid-template-rows: 1fr auto 1fr;
        }

        /* Кнопка на телефоне не должна вылезать за края */
        .btn {
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    }
</style>
</head>
<body>
    <div class="mobile-warning" id="mobileWarning">
        <h2>Откройте на компьютере</h2>
        <p>Это рабочее пространство создано для больших экранов.<br>Пожалуйста, зайдите с ПК или ноутбука.</p>
    </div>

    <div class="center-wrapper">
        <div class="top">
            <h1>coccoon</h1>
        </div>

        <p class="subtitle">рабочее пространство</p>

        <div class="bottom">
            <div class="balls-container">
                <div class="ball"></div>
                <div class="ball"></div>
                <div class="ball"></div>
                <div class="ball"></div>
                <div class="ball"></div>
                <a href="coccoon.html" class="btn" id="enterBtn">начать работу</a>
            </div>
        </div>
    </div>

    <script>
        const balls = document.querySelectorAll('.ball');
        const btn = document.getElementById('enterBtn');

        let completedBalls = 0;
        const totalBalls = balls.length;

        function jumpBall(ball, jumpCount, startDelay) {
            setTimeout(() => {
                let startTime = null;
                const jumpHeight = 30;
                const jumpDuration = 600;

                function animateJump(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = (timestamp - startTime) / jumpDuration;

                    if (progress < 1) {
                        const easeProgress = Math.sin(progress * Math.PI);
                        const y = easeProgress * jumpHeight;
                        ball.style.transform = `translateY(-${y}px)`;
                    } else {
                        ball.style.transform = 'translateY(0)';

                        if (jumpCount < 2) {
                            jumpBall(ball, jumpCount + 1, 0);
                        } else {
                            completedBalls++;
                            if (completedBalls === totalBalls) {
                                setTimeout(expandBlueBall, 100);
                            }
                        }
                        return;
                    }

                    requestAnimationFrame(animateJump);
                }

                requestAnimationFrame(animateJump);
            }, startDelay);
        }

function expandBlueBall() {
    const blueBall = balls[0];

    // 1. Фиксируем реальную ширину контейнера ДО анимации —
    //    это ровно расстояние от левого края первого круга
    //    до правого края последнего.
    const container = blueBall.parentElement;
    const targetWidth = container.getBoundingClientRect().width;

    // 2. Сбрасываем все трансформации от прыжков
    balls.forEach(ball => {
        ball.style.animation = 'none';
        ball.style.transform = 'translateY(0)';
    });

    // 3. Убираем остальные шары из потока, чтобы они не влияли на layout.
    //    Синий шар остаётся единственным flex-элементом и растягивается
    //    ровно на ширину контейнера.
    for (let i = 1; i < balls.length; i++) {
        balls[i].style.position = 'absolute';
        balls[i].style.pointerEvents = 'none';
        balls[i].style.opacity = '1';
    }

    // 4. Синий шар — растягиваем от 0 до targetWidth (по факту — от
    //    исходной ширины круга до полной ширины контейнера).
    const startWidth = blueBall.getBoundingClientRect().width;

    // Кнопка должна поместиться внутри «пилюли» — измерим её заранее.
    btn.style.opacity = '0';
    btn.style.display = 'block';
    const btnWidth = btn.offsetWidth;
    btn.style.display = '';
    btn.style.opacity = '';

    // Итоговая ширина — ровно ширина контейнера, но не меньше кнопки + отступы
    const finalWidth = Math.max(targetWidth, btnWidth + 40);

    blueBall.style.flexShrink = '0';
    blueBall.style.zIndex = '10';

    let startTime = null;
    const expandDuration = 2000;

    function animateExpand(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / expandDuration, 1);
        const easeProgress = 1 - Math.pow(1 - progress, 3);

        const currentWidth = startWidth + (finalWidth - startWidth) * easeProgress;

        // 5. Жёстко задаём ширину и позицию: левый край — на месте первого
        //    круга, правый — на месте последнего. Никаких margin.
        blueBall.style.width = `${currentWidth}px`;
        blueBall.style.minWidth = `${currentWidth}px`;
        blueBall.style.maxWidth = `${currentWidth}px`;
        blueBall.style.height = `${startWidth}px`;
        blueBall.style.borderRadius = `${startWidth / 2}px`;
        blueBall.style.margin = '0';

        // 6. Остальные шары плавно исчезают
        for (let i = 1; i < balls.length; i++) {
            balls[i].style.opacity = 1 - easeProgress;
        }

        if (progress >= 1) {
            // Финальная фиксация — ровно targetWidth
            blueBall.style.width = `${finalWidth}px`;
            blueBall.style.minWidth = `${finalWidth}px`;
            blueBall.style.maxWidth = `${finalWidth}px`;
            btn.classList.add('visible');
            return;
        }

        requestAnimationFrame(animateExpand);
    }

    requestAnimationFrame(animateExpand);
}

        balls.forEach((ball, index) => {
            jumpBall(ball, 0, index * 200);
        });

        btn.addEventListener('click', function(e) {
            e.preventDefault();

            // Маленький экран — заглушка
            if (window.matchMedia('(max-width: 1024px)').matches) {
                document.getElementById('mobileWarning').classList.add('show');
                return;
            }

            // Затемнение и переход
            const darken = document.createElement('div');
            Object.assign(darken.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                width: '100%',
                height: '100%',
                backgroundColor: '#0c121c',
                opacity: '0',
                transition: 'opacity 1s ease',
                zIndex: '9999',
                pointerEvents: 'none'
            });
            document.body.appendChild(darken);

            setTimeout(() => { darken.style.opacity = '1'; }, 50);
            setTimeout(() => { window.location.href = this.href; }, 1050);
        });
    </script>
</body>
</html>
